[build]
  publish = "_site"
  # Tests run first and the built files are checked last, so either failing
  # stops the deploy and the live site keeps its last good version
  command = "npm test && npm run build && npm run check:built"

[build.environment]
  NODE_VERSION = "20"
  GA_ID = "G-91HQ81WR67"

[[redirects]]
  from = "https://profoundfyi.netlify.app/*"
  to = "https://profound.fyi/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/ffc-2026"
  to = "/talks/fast-flow-conf-2026/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Link = "</llms.txt>; rel=\"describedby\"; type=\"text/markdown\", </sitemap.xml>; rel=\"sitemap\"; type=\"application/xml\", </.well-known/agent-skills/index.json>; rel=\"agent-skills\"; type=\"application/json\""
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; font-src 'self'; frame-src https://speakerdeck.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Machine-readable files for agents and other sites. Open CORS lets
# browser-based agents fetch them. HTML pages keep the defaults above.
[[headers]]
  for = "/laws.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/laws/*.md"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/.well-known/agent-skills/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/agent-skills/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

# Playbook pages as Markdown sit two or three folders deep. Both rules are
# explicit, whether or not Netlify's * matches across folders.
[[headers]]
  for = "/playbooks.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/playbooks/*/*.md"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/playbooks/*/artefacts/*.md"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "text/markdown; charset=utf-8"
