# Tests and the browser CSP check on every pull request and on main.
# Netlify deploys main on its own. Branch protection on main turns these
# checks into a gate on merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 20 is what Netlify builds with. 22 catches the next upgrade early.
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    name: Browser CSP check
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/browser-check-setup
      # Uses the analytics ID from netlify.toml, so the consent flow is
      # checked exactly as it ships
      - name: Build
        run: |
          GA_ID=$(sed -n 's/^ *GA_ID = "\(.*\)"$/\1/p' netlify.toml)
          GA_ID="$GA_ID" npm run build
      - name: Check for CSP violations
        run: npm run check:csp
