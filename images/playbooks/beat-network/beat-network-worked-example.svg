<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="IBM Plex Sans, -apple-system, Helvetica, Arial, sans-serif">
<title>A Beat Network for adopting a product operating model</title>
<desc>Three lines of change. Topology has beats T1 to T4. Sensing has beats S1 to S3. Capability has beats C1 to C3. Three gates connect them: T4 requires S3, C2 requires T3, and C3 requires S3. S3 is the gate for two other lines.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker></defs>
<rect width="700" height="330" fill="#fff"/>
<line x1="20" y1="104" x2="680" y2="104" stroke="#e5e5e5"/>
<text x="20" y="75" font-size="15" font-weight="600" fill="#1a1a1a">Topology</text>
<line x1="247" y1="70" x2="313" y2="70" stroke="#1a1a1a" stroke-width="3"/>
<line x1="347" y1="70" x2="413" y2="70" stroke="#1a1a1a" stroke-width="3"/>
<line x1="447" y1="70" x2="513" y2="70" stroke="#1a1a1a" stroke-width="3"/>
<line x1="20" y1="199" x2="680" y2="199" stroke="#e5e5e5"/>
<text x="20" y="170" font-size="15" font-weight="600" fill="#1a1a1a">Sensing</text>
<line x1="247" y1="165" x2="313" y2="165" stroke="#1a1a1a" stroke-width="3"/>
<line x1="347" y1="165" x2="413" y2="165" stroke="#1a1a1a" stroke-width="3"/>
<text x="20" y="265" font-size="15" font-weight="600" fill="#1a1a1a">Capability</text>
<line x1="247" y1="260" x2="513" y2="260" stroke="#1a1a1a" stroke-width="3"/>
<line x1="547" y1="260" x2="613" y2="260" stroke="#1a1a1a" stroke-width="3"/>
<line x1="444.5" y1="151.2" x2="514.1" y2="85.2" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<line x1="439.3" y1="87.7" x2="519.8" y2="240.5" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<line x1="448.1" y1="173.6" x2="610.1" y2="250.6" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<circle cx="230" cy="70" r="17" fill="#1a1a1a"/>
<text x="230" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">T1</text>
<circle cx="330" cy="70" r="17" fill="#1a1a1a"/>
<text x="330" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">T2</text>
<circle cx="430" cy="70" r="17" fill="#1a1a1a"/>
<text x="430" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">T3</text>
<circle cx="530" cy="70" r="17" fill="#1a1a1a"/>
<text x="530" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">T4</text>
<circle cx="230" cy="165" r="17" fill="#1a1a1a"/>
<text x="230" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">S1</text>
<circle cx="330" cy="165" r="17" fill="#1a1a1a"/>
<text x="330" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">S2</text>
<circle cx="430" cy="165" r="17" fill="#1a1a1a"/>
<text x="430" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">S3</text>
<circle cx="230" cy="260" r="17" fill="#1a1a1a"/>
<text x="230" y="265" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">C1</text>
<circle cx="530" cy="260" r="17" fill="#1a1a1a"/>
<text x="530" y="265" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">C2</text>
<circle cx="630" cy="260" r="17" fill="#1a1a1a"/>
<text x="630" y="265" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">C3</text>
<line x1="20" y1="306" x2="56" y2="306" stroke="#1a1a1a" stroke-width="3"/><text x="64" y="311" font-size="13" fill="#555">Beats in order</text>
<line x1="190" y1="306" x2="226" y2="306" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="236" y="311" font-size="13" fill="#555">Gate: the beat it points to needs this one first</text>
</svg>
